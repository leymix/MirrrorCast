              "background-dark": "#101622",

<div class="absolute inset-0 bg-gradient-to-t from-background-dark/80 via-transparent to-transparent opacity-60"></div>
</div>
</div>
<!-- Text Content -->
<div class="flex flex-col items-center text-center gap-3">
<h1 class="text-3xl md:text-4xl font-bold leading-tight tracking-tight">
                    Mirror to any Screen
                </h1>
<p class="text-neutral-500 dark:text-[#92a4c9] text-base md:text-lg font-normal leading-relaxed max-w-[300px]">
                    Stream photos, videos, and games to your TV in real-time with zero latency.
                </p>
</div>
</div>

<div class="w-full flex flex-col items-center pb-8 pt-4 px-4 gap-6 bg-gradient-to-t from-background-light dark:from-background-dark to-transparent">

<div class="flex flex-row items-center justify-center gap-3">
<div class="h-2 w-2 rounded-full bg-primary ring-2 ring-primary/30"></div>
<div class="h-2 w-2 rounded-full bg-neutral-300 dark:bg-[#324467]"></div>
<div class="h-2 w-2 rounded-full bg-neutral-300 dark:bg-[#324467]"></div>
</div>

<div class="w-full max-w-[480px]">
