name: Android CI/CD

on:
  push:
    branches:
      - main
      - develop
      - staging
  pull_request:
    branches:
      - main
      - develop
      - staging
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to build'
        required: true
        type: choice
        options:
          - dev
          - stg
          - prod
      release_version:
        description: 'Release version (e.g., 1.0.0)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
      
    - name: Override Java Home for CI (Linux)
      run: |
        # Remove Windows-specific Java home path for CI/CD
        sed -i 's|org.gradle.java.home=.*|# org.gradle.java.home (removed for CI/CD - using GitHub Actions JDK)|' gradle.properties || true
        echo "CI/CD: Using GitHub Actions JDK instead of Windows path"
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Determine Environment
      id: env
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          ENV="${{ github.event.inputs.environment }}"
        elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
          ENV="prod"
        elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
          ENV="stg"
        elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
          ENV="dev"
        else
          ENV="dev"
        fi
        echo "environment=$ENV" >> $GITHUB_OUTPUT
        echo "Building for environment: $ENV"
      
    - name: Verify Gradle Wrapper
      run: |
        ls -la gradle/wrapper/
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "ERROR: gradle-wrapper.jar not found!"
          exit 1
        fi
      
    - name: Build Debug APK
      run: |
        ENV="${{ steps.env.outputs.environment }}"
        ./gradlew assemble${ENV}Debug --no-daemon
      
    - name: Setup Keystore for Release Build
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop')
      run: |
        echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > keystore.jks
        
    - name: Build Release APK
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop')
      run: |
        ENV="${{ steps.env.outputs.environment }}"
        ./gradlew assemble${ENV}Release --no-daemon
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEYSTORE_FILE: keystore.jks
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk-${{ steps.env.outputs.environment }}
        path: app/build/outputs/apk/${{ steps.env.outputs.environment }}/debug/app-${{ steps.env.outputs.environment }}-debug.apk
        retention-days: 7
        
    - name: Upload Release APK
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop')
      uses: actions/upload-artifact@v4
      with:
        name: release-apk-${{ steps.env.outputs.environment }}
        path: app/build/outputs/apk/${{ steps.env.outputs.environment }}/release/app-${{ steps.env.outputs.environment }}-release.apk
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
      
    - name: Override Java Home for CI (Linux)
      run: |
        # Remove Windows-specific Java home path for CI/CD
        sed -i 's|org.gradle.java.home=.*|# org.gradle.java.home (removed for CI/CD - using GitHub Actions JDK)|' gradle.properties || true
        echo "CI/CD: Using GitHub Actions JDK instead of Windows path"
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Determine Environment
      id: env
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          ENV="${{ github.event.inputs.environment }}"
        elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
          ENV="prod"
        else
          ENV="prod"
        fi
        echo "environment=$ENV" >> $GITHUB_OUTPUT
        echo "Releasing for environment: $ENV"
      
    - name: Verify Gradle Wrapper
      run: |
        ls -la gradle/wrapper/
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "ERROR: gradle-wrapper.jar not found!"
          exit 1
        fi
      
    - name: Setup Keystore
      run: |
        echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > keystore.jks
        
    - name: Build Release APK
      run: |
        ENV="${{ steps.env.outputs.environment }}"
        ./gradlew assemble${ENV}Release --no-daemon
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEYSTORE_FILE: keystore.jks
        
    - name: Generate Release Notes
      id: release_notes
      run: |
        ENV="${{ steps.env.outputs.environment }}"
        VERSION=$(grep versionName app/build.gradle.kts | sed 's/.*versionName = "\(.*\)".*/\1/')
        VERSION_CODE=$(grep versionCode app/build.gradle.kts | sed 's/.*versionCode = \(.*\).*/\1/')
        ENV_UPPER=$(echo "$ENV" | tr '[:lower:]' '[:upper:]')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "## MirrorCast $ENV_UPPER v$VERSION" > release_notes.md
        echo "" >> release_notes.md
        echo "**Environment:** $ENV" >> release_notes.md
        echo "**Version Code:** $VERSION_CODE" >> release_notes.md
        echo "" >> release_notes.md
        echo "### Changes" >> release_notes.md
        git log --pretty=format:"- %s" -10 >> release_notes.md
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/${{ steps.env.outputs.environment }}/release/app-${{ steps.env.outputs.environment }}-release.apk
        body_path: release_notes.md
        tag_name: ${{ steps.env.outputs.environment }}-v${{ steps.release_notes.outputs.version }}
        name: MirrorCast ${{ steps.env.outputs.environment }} v${{ steps.release_notes.outputs.version }}
        draft: false
        prerelease: ${{ steps.env.outputs.environment != 'prod' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

